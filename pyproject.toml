[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fans-utils"
version = "0.1.0"
description = "Extensible FANS event tools; first tool: timed application clicker core."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fans-utils = "fans_utils.cli:main"

# Single source for event profiles: the repo's top-level profiles/ directory is shipped inside
# the wheel as the fans_utils.profiles data package, so an installed CLI can still list/show them.
[tool.setuptools]
packages = ["fans_utils", "fans_utils.profiles"]
package-dir = { "fans_utils" = "fans_utils", "fans_utils.profiles" = "profiles" }

[tool.setuptools.package-data]
"fans_utils.profiles" = ["*.json"]
